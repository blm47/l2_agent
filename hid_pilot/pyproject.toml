[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hid-pilot"
version = "0.3.1"
requires-python = ">=3.12,<3.13"
dependencies = ["pyside6>=6.7,<7", "pywin32>=306", "pyserial>=3.5,<4", "numpy>=2,<3", "opencv-python>=4.10,<5", "pydantic>=2.8,<3"]

[project.scripts]
hid-pilot = "hid_pilot.__main__:main"

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4,<2"]
build = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["hid_pilot"]
