name: HID Pilot release

on:
  push:
    tags:
      - "hid-pilot-v*"

permissions:
  contents: write

concurrency:
  group: hid-pilot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hid_pilot
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check release version
        id: version
        run: |
          $releaseVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "hid-pilot-v$releaseVersion") {
            throw "Release tag does not match pyproject.toml"
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-build.lock
      - name: Build EXE and distribution archives
        run: python packaging/build.py
      - name: Test standalone EXE and Portable
        run: python packaging/smoke_build.py
      - name: Prepare release notes
        run: |
          python -c "from pathlib import Path; text=Path('RELEASE_NOTES.md').read_text('utf-8').split('\n# ', 1)[0]; Path('build/release-notes.md').write_text(text, encoding='utf-8')"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title "HID Pilot $env:RELEASE_VERSION" --notes-file build/release-notes.md dist/HID_Pilot.exe "dist/HID_Pilot_Portable-$env:RELEASE_VERSION.zip" "dist/HID_Pilot_Extensions-$env:RELEASE_VERSION.zip" "dist/HID_Pilot_Full-$env:RELEASE_VERSION.zip" dist/SHA256.json
